<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand">Loja Virtual</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#produtos">Catálogo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#carrinho">Carrinho</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Catálogo de Produtos</h1>
        <div id="produtos" class="row"></div>
    </div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Carrinho de Compras</h1>
            <a class="btn btn-secondary" href="#produtos">Voltar ao início do catálogo</a>
        </div>
        <div id="carrinho" class="row"></div>
        <div id="resumo" class="mt-4"></div>
    </div>

    <div id="detalhes" class="modal fade" tabindex="-1" aria-labelledby="detalhesLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesLabel">Detalhes do produto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h3 id="titulo"></h3>
                    <p id="descricao"></p>
                    <img id="poster" class="img-fluid" src="" alt="Poster">
                    <div id="informacoes-adicionais" class="mt-3">
                        <p><strong>Categoria:</strong> <span id="categoria"></span></p>
                        <p><strong>Preço:</strong> <span id="preco"></span></p>
                        <p><strong>Avaliação:</strong> <span id="avaliacao"></span></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
