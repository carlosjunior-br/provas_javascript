<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto plataforma de streaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand">Projeto plataforma de streaming</a>
        <div class="navbar-nav">
            <a id="menu-filmes" class="nav-link active" href="#">Filmes</a>
            <a id="menu-series" class="nav-link" href="#">Séries</a>
        </div>
    </nav>

    <div class="container">
        <!-- Carrossel -->
        <div id="carrosselBanners" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators" id="carousel-indicators"></div>
            <div class="carousel-inner" id="carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carrosselBanners" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrosselBanners" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
        <!-- Catálogo -->
        <div id="catalogo" class="row mt-4"></div>
    </div>

    <div id="detalhes" class="modal fade" tabindex="-1" aria-labelledby="detalhesLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalhesLabel">Detalhes do filme / série</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h3 id="titulo"></h3>
                    <p id="descricao"></p>
                    <img id="poster" class="img-fluid" src="" alt="Poster">
                    <div id="informacoes-adicionais" class="mt-3">
                        <p><strong>Data de Lançamento:</strong> <span id="data-lancamento"></span></p>
                        <p><strong>Avaliação:</strong> <span id="avaliacao"></span></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="./scripts.js"></script>
</body>

</html>
